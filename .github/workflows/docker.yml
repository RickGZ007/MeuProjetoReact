name: CD - DockerHub Deploy
# Este workflow é acionado em pushes para a branch "main". Ele faz o build da imagem Docker do projeto e a envia para o DockerHub. Certifique-se de configurar os segredos DOCKER_USERNAME e DOCKER_PASSWORD no repositório para autenticação.
on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Login no DockerHub
      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build da imagem
      - name: Build da imagem Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/meu-projeto-react .

      # 4. Enviar para o DockerHub
      - name: Push da imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/meu-projeto-react
