name: Testes React
  /*
    Este workflow é acionado em pushes e pull requests para a branch master.
    Ele executa os testes do projeto React e, independentemente do resultado, envia uma notificação para um canal do Discord.
  */
on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npm test -- --watchAll=false

      - name: Notificar Discord
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"content\": \"📢 **GitHub Actions Finalizado** 🚀
            👤 Autor: ${{ github.actor }}
            📂 Repositório: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            ✅ Status: ${{ job.status }}
            🔗 Execução: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            \"
          }" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}